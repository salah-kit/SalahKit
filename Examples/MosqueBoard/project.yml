# Generates MosqueBoard.xcodeproj. Run `xcodegen` in this folder after changing it, and commit
# both files (STANDARD.md, Apps).
#
# Generate from a clone whose folder is named `SalahKit`, as CI's checkout is: XcodeGen names
# the local package's folder reference after the folder that `../..` resolves to, so another
# name changes the project and fails CI's generate check.
name: MosqueBoard
options:
  bundleIdPrefix: io.github.salah-kit
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
packages:
  SalahKit:
    path: ../..
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # Builds pass SWIFT_DEFAULT_ACTOR_ISOLATION=nonisolated on the command line to check the
    # other isolation setting (proposal §3.1); MainActor is Xcode 26's default for new apps.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
targets:
  MosqueBoard:
    type: application
    platform: iOS
    sources:
      # The app's code and resources, which the tvOS app compiles too.
      - path: Shared
    dependencies:
      - package: SalahKit
        product: SalahCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.salah-kit.MosqueBoard
        GENERATE_INFOPLIST_FILE: YES
        # iPad only. Set per target: XcodeGen's iOS preset writes "1,2" at target level, which
        # would override a project-level value.
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_KEY_CFBundleDisplayName: MosqueBoard
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIRequiresFullScreen: NO
  MosqueBoardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MosqueBoardTests
    dependencies:
      # Hosted by the app: SalahCore's symbols come from the app binary, not a second copy.
      - target: MosqueBoard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.salah-kit.MosqueBoardTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
  MosqueBoardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MosqueBoardUITests
      - path: JourneySupport
    dependencies:
      - target: MosqueBoard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.salah-kit.MosqueBoardUITests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        TEST_TARGET_NAME: MosqueBoard
  # The same board on a mosque's TV. It compiles the iPad app's sources and resources (Shared)
  # and adds only what a TV needs (MosqueBoardTV).
  MosqueBoardTV:
    type: application
    platform: tvOS
    # The same product and module name as the iPad app, so the unit tests' `@testable import
    # MosqueBoard` and the link check's `MosqueBoard.app` work on both platforms. `productName`
    # names the product XcodeGen references and the tests' host; PRODUCT_NAME is the setting.
    productName: MosqueBoard
    sources:
      - path: Shared
      - path: MosqueBoardTV
    dependencies:
      - package: SalahKit
        product: SalahCore
    settings:
      base:
        PRODUCT_NAME: MosqueBoard
        # One App Store record for the iPad and the TV app (universal purchase).
        PRODUCT_BUNDLE_IDENTIFIER: io.github.salah-kit.MosqueBoard
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MosqueBoard
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
  MosqueBoardTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      # The iPad app's unit tests: the logic they test is the same code on both platforms.
      - path: MosqueBoardTests
      - path: MosqueBoardTVTests
    dependencies:
      - target: MosqueBoardTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.salah-kit.MosqueBoardTVTests
        GENERATE_INFOPLIST_FILE: YES
  MosqueBoardTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: MosqueBoardTVUITests
      - path: JourneySupport
    dependencies:
      - target: MosqueBoardTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.salah-kit.MosqueBoardTVUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MosqueBoardTV
schemes:
  MosqueBoard:
    build:
      targets:
        MosqueBoard: all
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MosqueBoardTests
        - MosqueBoardUITests
  MosqueBoardTV:
    build:
      targets:
        MosqueBoardTV: all
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MosqueBoardTVTests
        - MosqueBoardTVUITests
