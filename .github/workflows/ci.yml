name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same pull request or branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# An explicit `bash` runs every step with `-eo pipefail`. GitHub's default shell omits pipefail,
# so a failing command piped into another, such as `xcodebuild … | tee`, would pass the step.
defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Linux (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # swift:6.2-noble is the oldest toolchain the manifest (swift-tools-version 6.2) allows.
        image: ["swift:6.2-noble", "swift:latest"]
    container: ${{ matrix.image }} # zizmor: ignore[unpinned-images] -- swift:latest tracks the newest release on purpose
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses] -- STANDARD.md pins official actions to a major version
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test --filter LinuxLocaleProbe

