name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same pull request or branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: macOS (build, test, Apple platforms)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses] -- STANDARD.md pins official actions to a major version
        with:
          persist-credentials: false

      # Hosted runners don't offer Xcode 27, so CI uses the newest installed Xcode 26
      # (docs/rfcs/0001-core.md, section 6.4). The runner's default Xcode can lag behind it.
      - name: Select the newest Xcode 26
        run: scripts/select-xcode.sh

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # Generic destinations compile for each simulator platform without booting a simulator.
      # Xcode 26 on macos-26 ships every simulator SDK the manifest supports. If a future image
      # drops one, the step reports it as skipped instead of failing (STANDARD.md, CI).
      - name: Build for Apple platforms
        run: |
          for platform in "iOS Simulator" "watchOS Simulator" "tvOS Simulator" "visionOS Simulator"; do
            echo "::group::${platform}"
            scripts/build-apple-platform.sh "${platform}"
            echo "::endgroup::"
          done

  linux:
    name: Linux (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # swift:6.2-noble is the oldest toolchain the manifest (swift-tools-version 6.2) allows.
        image: ["swift:6.2-noble", "swift:latest"]
    container: ${{ matrix.image }} # zizmor: ignore[unpinned-images] -- swift:latest tracks the newest release on purpose
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses] -- STANDARD.md pins official actions to a major version
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pinned to the toolchain contributors format with locally (Swift 6.4), so the formatter's
    # output doesn't change under a pull request when swift:latest moves.
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses] -- STANDARD.md pins official actions to a major version
        with:
          persist-credentials: false
      - name: swift format lint
        run: scripts/lint.sh

  isolation:
    name: Default isolation (${{ matrix.isolation }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The package must compile for adopters whose targets default to either isolation
        # (docs/rfcs/0001-core.md, section 6.3). The flag needs Swift 6.2 or later.
        isolation: [nonisolated, MainActor]
    container: swift:latest # zizmor: ignore[unpinned-images] -- the newest toolchain on purpose
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses] -- STANDARD.md pins official actions to a major version
        with:
          persist-credentials: false
      - name: Build
        env:
          ISOLATION: ${{ matrix.isolation }}
        run: |
          if [ "${ISOLATION}" = "MainActor" ]; then
            # The manifest applies MainActor default isolation to SalahKit's own targets only.
            # `-Xswiftc -default-isolation` would reach SalahTimes too and make its types
            # main-actor-isolated, which no app sees (docs/rfcs/0001-core.md, section 6.3).
            SALAHKIT_DEFAULT_ISOLATION=MainActor swift build --build-tests
          else
            swift build --build-tests
          fi

  mosqueboard:
    name: MosqueBoard (generate, build, journeys)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses] -- STANDARD.md pins official actions to a major version
        with:
          persist-credentials: false

      # Hosted runners don't offer Xcode 27, so CI uses the newest installed Xcode 26
      # (docs/rfcs/0001-core.md, section 6.4). The project stays compatible with it.
      - name: Select the newest Xcode 26
        run: scripts/select-xcode.sh

      # The committed project must be exactly what project.yml generates (STANDARD.md, Apps).
      # `git status` also catches generated files that were never committed; the checkout's
      # folder is named SalahKit, the name the project was generated under (see project.yml).
      - name: Check the generated project
        run: |
          brew install xcodegen
          (cd Examples/MosqueBoard && xcodegen --quiet)
          changes="$(git status --porcelain -- Examples/MosqueBoard)"
          if [[ -n "${changes}" ]]; then
            echo "${changes}"
            git diff -- Examples/MosqueBoard
            echo "::error::Examples/MosqueBoard differs from what project.yml generates."
            exit 1
          fi

      # The app builds under both default-isolation settings (proposal section 3.1). MosqueBoard
      # builds no SalahTimes code, so the command-line setting can reach every target it builds.
      - name: Build (MainActor and nonisolated)
        run: |
          mkdir -p Examples/MosqueBoard/.derived
          for isolation in MainActor nonisolated; do
            echo "::group::${isolation}"
            xcodebuild build-for-testing \
              -project Examples/MosqueBoard/MosqueBoard.xcodeproj -scheme MosqueBoard \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "Examples/MosqueBoard/.derived/${isolation}" \
              SWIFT_DEFAULT_ACTOR_ISOLATION="${isolation}" CODE_SIGNING_ALLOWED=NO \
              | tee "Examples/MosqueBoard/.derived/${isolation}.log"
            echo "::endgroup::"
          done

      # The timetable example links SalahCore only, although the package graph resolves
      # SalahTimes for SalahCalculation (proposal section 2.3 #2): checked in the build graph and
      # in the binary.
      - name: Check that MosqueBoard links no calculation
        run: |
          scripts/check-mosqueboard-links.sh Examples/MosqueBoard/.derived/MainActor.log \
            Examples/MosqueBoard/.derived/MainActor/Build/Products/Debug-iphonesimulator

      # The journeys need an iPad simulator. The runner's images name them differently over
      # time, so the step picks the first available iPad; without one, the job stays build-only
      # and says so (STANDARD.md, CI).
      - name: Unit tests and journeys on an iPad simulator
        run: |
          udid="$(xcrun simctl list devices available | grep -E '^ +iPad' | head -n 1 \
            | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' || true)"
          if [[ -z "${udid}" ]]; then
            echo "::warning::No iPad simulator is available on this runner; MosqueBoard is build-only here."
            exit 0
          fi
          xcrun simctl list devices available | grep "${udid}"
          xcodebuild test \
            -project Examples/MosqueBoard/MosqueBoard.xcodeproj -scheme MosqueBoard \
            -destination "id=${udid}" \
            -derivedDataPath Examples/MosqueBoard/.derived/test \
            -resultBundlePath Examples/MosqueBoard/.derived/MosqueBoard.xcresult

      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v7 # zizmor: ignore[unpinned-uses] -- STANDARD.md pins official actions to a major version
        with:
          name: MosqueBoard.xcresult
          path: Examples/MosqueBoard/.derived/MosqueBoard.xcresult
          if-no-files-found: ignore
